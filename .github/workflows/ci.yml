name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python 3.11.9 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Select reference Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Show runtime
        run: python --version
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Verify seven offline CLI scenarios
        run: python scripts/check_examples.py --out work/ci-demo
      - name: Run embedding example
        run: python -m examples.embedded_agent
